name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    name: Lint release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Install shfmt
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
      - name: Run ShellCheck
        run: |
          shellcheck -x linux-package-source-manager.sh install.sh
          shellcheck -x -e SC2034,SC2329 tests/run_tests.sh
      - name: Check shfmt formatting
        run: |
          shfmt -d linux-package-source-manager.sh install.sh
          shfmt -d tests/run_tests.sh

  test:
    name: Offline tests (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["20.04", "22.04", "24.04"]
    container:
      image: ubuntu:${{ matrix.ubuntu-version }}
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y bash coreutils tar curl util-linux python3-minimal gawk grep sed findutils
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run offline regression suite
        run: |
          bash tests/run_tests.sh
          bash tests/test_installer.sh

  release:
    name: Publish GitHub Release
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Verify tag, source version and changelog entry
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          source_version="$(awk -F'"' '/^readonly APP_VERSION=/{print $2; exit}' linux-package-source-manager.sh)"

          if [[ "$tag" != "v$version" || -z "$source_version" || "$source_version" != "$version" ]]; then
            printf 'Release tag %s does not match source version %s.\n' "$tag" "${source_version:-missing}" >&2
            exit 1
          fi

          awk -v heading="## [$version]" '
            index($0, heading) == 1 {
              suffix = substr($0, length(heading) + 1)
              if (suffix == "" || suffix ~ /^[[:space:]]/) found = 1
            }
            END { exit !found }
          ' CHANGELOG.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "script=linux-package-source-manager.sh" >> "$GITHUB_OUTPUT"

      - name: Generate release notes and checksum
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SCRIPT_NAME: ${{ steps.version.outputs.script }}
        shell: bash
        run: |
          set -Eeuo pipefail
          awk -v heading="## [${RELEASE_VERSION}]" '
            index($0, heading) == 1 {
              suffix = substr($0, length(heading) + 1)
              if (suffix == "" || suffix ~ /^[[:space:]]/) {
                in_section = 1
                next
              }
            }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

          sha256sum linux-package-source-manager.sh > linux-package-source-manager.sh.sha256
          {
            cat RELEASE_NOTES.md
            printf '\n## Installation\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/power0matin/linux-package-source-manager/%s/%s | sudo bash -s -- --yes\n```\n\n## Verify\n\nDownload `%s` and `%s.sha256` from this release, then run:\n\n```bash\nsha256sum -c %s.sha256\n```\n' \
              "$RELEASE_TAG" "$SCRIPT_NAME" "$SCRIPT_NAME" "$SCRIPT_NAME" "$SCRIPT_NAME"
          } > RELEASE_BODY.md
          grep -Fq "$SCRIPT_NAME" RELEASE_BODY.md
          test -s "$SCRIPT_NAME"
          test -s "$SCRIPT_NAME.sha256"
          sha256sum -c "$SCRIPT_NAME.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.tag }}"
          body_path: RELEASE_BODY.md
          files: |
            linux-package-source-manager.sh
            linux-package-source-manager.sh.sha256
            install.sh
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
