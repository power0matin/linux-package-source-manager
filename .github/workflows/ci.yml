name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Install shfmt
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
      - name: Run ShellCheck
        run: |
          shellcheck -x linux-package-source-manager.sh
          # The test suite intentionally sources the application and mutates its globals/functions.
          shellcheck -x -e SC2034,SC2329 tests/run_tests.sh
      - name: Check shfmt formatting
        run: |
          shfmt -d linux-package-source-manager.sh
          shfmt -d tests/run_tests.sh

  test:
    name: Offline tests (Ubuntu ${{ matrix.ubuntu-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ["24.04", "22.04", "20.04"]
    container:
      image: ubuntu:${{ matrix.ubuntu-version }}
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y bash coreutils tar curl util-linux python3-minimal gawk grep sed findutils
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run offline regression suite
        run: bash tests/run_tests.sh
